[entity-description]
fd-selector=Works like the vanilla selector combinator but needs no power. For example, pick the destination with the most riders aboard the train at a stop (see Help).
fd-arithmetic=Works like the vanilla arithmetic combinator but needs no power. For example, divide a town's waiting passengers by 20 to set a train stop's priority (0 to 255).
fd-spaceport-silo=Deliver colonists, mail and goods by train to build and launch rockets. Each launch adds a satellite.
fd-silo=Deliver colonists, mail and goods by train to build and launch rockets. Each launch adds a satellite.
fd-decider=Works like the vanilla decider combinator but needs no power. Combine several conditions with AND or OR, for example to switch a train stop off when a site's input pile is nearly full or its booster is missing.
fd-site-signals=Build inside a site's ring. Every second it outputs that site's stockpile as circuit signals (and the town population or industry level). Wire it to a train stop or rail signal.

[item-description]
fd-selector=Works like the vanilla selector combinator but needs no power. For example, pick the destination with the most riders aboard the train at a stop (see Help).
fd-dest=Bound for the town or Spaceport with this number (shown after its name). They ride until a train stops there. A train stop there is named after it, so a wildcard interrupt can send trains to "[item wildcard] unload".
fd-arithmetic=Works like the vanilla arithmetic combinator but needs no power. For example, divide a town's waiting passengers by 20 to set a train stop's priority.
fd-decider=Works like the vanilla decider combinator but needs no power. Combine several conditions with AND or OR.
fd-site-signals=Build inside a site's ring. Every second it outputs that site's stockpile as circuit signals (and the town population or industry level). Wire it to a train stop or rail signal.
